apply plugin: 'com.android.application'

// Optional upload identity is supplied outside Git. Never fall back to the debug key for Release.
def uploadNames = ['CMC_UPLOAD_STORE_FILE', 'CMC_UPLOAD_STORE_PASSWORD', 'CMC_UPLOAD_KEY_ALIAS', 'CMC_UPLOAD_KEY_PASSWORD']
def uploadValues = uploadNames.collect { System.getenv(it) }
if (uploadValues.any { it } && !uploadValues.every { it }) {
    throw new GradleException('Upload signing configuration is incomplete; supply all four CMC_UPLOAD_* variables privately.')
}

android {
    namespace = "com.casademusicacastillo.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.casademusicacastillo.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (uploadValues.every { it }) {
            upload {
                storeFile file(uploadValues[0])
                storePassword uploadValues[1]
                keyAlias uploadValues[2]
                keyPassword uploadValues[3]
            }
        }
    }
    buildTypes {
        publicDemo {
            initWith debug
            applicationIdSuffix ".publicdemo"
            matchingFallbacks = ['debug']
        }
        connectedQa {
            initWith debug
            applicationIdSuffix ".qa"
            matchingFallbacks = ['debug']
        }
        stagingConnected {
            initWith debug
            applicationIdSuffix ".staging"
            matchingFallbacks = ['debug']
        }
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (uploadValues.every { it }) signingConfig signingConfigs.upload
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Protect direct Gradle invocations against stale assets from another build.
def verifyConnectedWebAssets = { String nativeVariant ->
        def assets = file('src/main/assets/public')
        def marker = new File(assets, 'cmc-build.json')
        if (!marker.isFile()) throw new GradleException('Build and sync the selected web assets with scripts/build-android.mjs first.')
        def build = new groovy.json.JsonSlurper().parse(marker)
        def capacitor = new groovy.json.JsonSlurper().parse(file('src/main/assets/capacitor.config.json'))
        if (capacitor.loggingBehavior != 'none' || capacitor.android?.allowMixedContent != false ||
            capacitor.android?.webContentsDebuggingEnabled == true || capacitor.server?.url || capacitor.server?.cleartext == true) {
            throw new GradleException('Capacitor Release configuration must disable debugging, mixed content, live reload and production logging.')
        }
        def settings = rootProject.file('../src/environments/environment-settings.ts').text
        def expectedProduction = (settings =~ /PRODUCTION_API_BASE_URL = '([^']+)'/)[0][1]
        if (build.nativeVariant != nativeVariant) {
            throw new GradleException('Web assets do not match the requested Android variant.')
        }
        if (nativeVariant == 'publicDemo' && (build.environment != 'production' || build.variant != 'debug' ||
            build.publicDemo != true || build.angularConfiguration != 'production,public-demo')) {
            throw new GradleException('Public demo requires the read-only Production Debug web assets.')
        }
        if (nativeVariant == 'connectedQa' && (build.environment != 'production' || build.variant != 'qa' ||
            build.publicDemo != false || build.angularConfiguration != 'production')) {
            throw new GradleException('Connected QA requires the Production routes with the QA transport restriction.')
        }
        if (nativeVariant == 'stagingConnected' && (build.environment != 'staging' || build.variant != 'debug' ||
            build.publicDemo != false || build.angularConfiguration != 'staging')) {
            throw new GradleException('Connected Staging requires explicitly isolated staging web assets.')
        }
        if (nativeVariant == 'release' && (!(build.environment in ['production', 'staging']) || build.variant != 'release' || build.publicDemo == true)) {
            throw new GradleException('Release requires production or explicitly isolated staging web assets.')
        }
        def endpoint = new URI(build.apiBaseUrl as String)
        if (endpoint.scheme != 'https' || endpoint.userInfo || endpoint.query || endpoint.fragment || !(endpoint.path in ['', '/'])) {
            throw new GradleException('Release requires an HTTPS API origin without credentials or URL parameters.')
        }
        if ((build.environment == 'production' && build.apiBaseUrl != expectedProduction) ||
            (build.environment == 'staging' && (!build.isolated || !endpoint.host ||
                !(endpoint.host ==~ /(?i).*\.[a-z][a-z0-9-]*/) || endpoint.host ==~ /(?i).*\.(localhost|local|internal)/ ||
                endpoint.host.equalsIgnoreCase(new URI(expectedProduction).host) ||
                endpoint.host.toLowerCase(Locale.ROOT).endsWith('.' + new URI(expectedProduction).host)))) {
            throw new GradleException('Release environment and API origin do not match the selected build.')
        }
        def actualFiles = fileTree(assets).files.collect { assets.toPath().relativize(it.toPath()).toString().replace('\\', '/') }.findAll { it != 'cmc-build.json' }.sort()
        if (!build.webFiles || actualFiles != build.webFiles.keySet().toList().sort()) {
            throw new GradleException('Web asset inventory is incomplete or stale; rebuild and sync it.')
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        build.webFiles.each { relative, expected ->
            def asset = new File(assets, relative)
            if (!asset.isFile() || digest.digest(asset.bytes).encodeHex().toString() != expected) {
                throw new GradleException('Web assets changed after environment selection; rebuild and sync them.')
            }
        }
        if (!fileTree(assets).matching { include '**/*.map' }.isEmpty()) {
            throw new GradleException('Public demo and Release assets must not contain source maps.')
        }
}
def verifyReleaseWebAssets = tasks.register('verifyReleaseWebAssets') {
    doLast { verifyConnectedWebAssets('release') }
}
def verifyPublicDemoWebAssets = tasks.register('verifyPublicDemoWebAssets') {
    doLast { verifyConnectedWebAssets('publicDemo') }
}
def verifyConnectedQaWebAssets = tasks.register('verifyConnectedQaWebAssets') {
    doLast { verifyConnectedWebAssets('connectedQa') }
}
def verifyStagingConnectedWebAssets = tasks.register('verifyStagingConnectedWebAssets') {
    doLast { verifyConnectedWebAssets('stagingConnected') }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn verifyReleaseWebAssets }
tasks.matching { it.name == 'prePublicDemoBuild' }.configureEach { dependsOn verifyPublicDemoWebAssets }
tasks.matching { it.name == 'preConnectedQaBuild' }.configureEach { dependsOn verifyConnectedQaWebAssets }
tasks.matching { it.name == 'preStagingConnectedBuild' }.configureEach { dependsOn verifyStagingConnectedWebAssets }

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
