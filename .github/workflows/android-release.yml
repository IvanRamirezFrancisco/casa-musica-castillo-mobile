name: Android - Verificación Release

on:
  pull_request:
    branches: [develop, main, feature/actividad-4-integracion-movil, feature/android-release-google-play, feature/privacidad-play-compliance, feature/tt05-sesion-segura, feature/conciliacion-validadores-equipo, feature/uiux-adaptativo-multidispositivo, fix/galaxy-a55-integracion-real, feature/uiux-direccion-a, fix/aceptacion-a55-p0, feature/refinamiento-comercial-a55, feature/refinamiento-cuenta-favoritos-carrito, feature/galeria-experiencia-comercial]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: scope
        run: node scripts/detect-change-scope.mjs

  release:
    name: Verificar Android Release sin firma
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - run: npm run test:build-config
      - name: Generar APK y AAB técnicos sin firma
        run: |
          chmod +x android/gradlew
          npm run android:release
      - name: Verificar entorno, manifiesto, paquetes y R8
        run: npm run android:verify-release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-release-unsigned-verification
          path: |
            reports/android-packages/production-release/
            android/app/build/outputs/mapping/release/
          if-no-files-found: error
          retention-days: 14
      - name: Identificar el alcance del paquete
        run: |
          echo '## Release técnico sin firma' >> "$GITHUB_STEP_SUMMARY"
          echo 'APK/AAB optimizados con R8 y recursos reducidos; hashes, entorno y SHA en build-report.json.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No instalados, no firmados con upload key y no listos para publicar en Google Play.' >> "$GITHUB_STEP_SUMMARY"
