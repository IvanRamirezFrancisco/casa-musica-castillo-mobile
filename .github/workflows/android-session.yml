name: Android - Sesión segura TT05
on:
  pull_request:
    branches: [develop, main, feature/actividad-4-integracion-movil, feature/android-release-google-play, feature/privacidad-play-compliance, feature/tt05-sesion-segura, feature/conciliacion-validadores-equipo, feature/uiux-adaptativo-multidispositivo, fix/galaxy-a55-integracion-real]
  push:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        run: node scripts/detect-change-scope.mjs
  session:
    name: Sesión segura Android
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MAESTRO_CLI_NO_ANALYTICS: 1
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - name: Compilar APK conectado solo al fixture HTTP de localhost
        run: node scripts/build-android.mjs --environment device --variant debug --api-url http://127.0.0.1:18181
      - name: Instalar Maestro CLI oficial
        run: |
          curl --fail --location --retry 3 https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
      - name: Habilitar KVM del runner efímero
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Comprobar sesión nativa en aplicación real con HTTP controlado
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r reports/android-packages/device-debug/app-debug.apk
            node scripts/test-android-session.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-session-controlled-http
          path: |
            reports/android-session/
            reports/android-packages/device-debug/
          if-no-files-found: error
          retention-days: 14
