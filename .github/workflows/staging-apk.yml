name: Release - Staging APK

on:
  push:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  quality-gate:
    name: Verificar DEVOPS QUALITY GATE
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v7
      - name: Exigir Quality Gate aprobado para el mismo SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUALITY_GATE_CHECKS: DEVOPS QUALITY GATE
          QUALITY_GATE_MAX_ATTEMPTS: 80
          QUALITY_GATE_INTERVAL_MS: 15000
          QUALITY_GATE_REPORT: reports/staging-quality-gate.json
        run: node scripts/quality-gate.mjs
      - name: Publicar evidencia del gate de Staging
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-quality-gate
          path: reports/staging-quality-gate.json
          if-no-files-found: error
          retention-days: 14

  staging-apk:
    name: Generar APK de Staging
    needs: quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Obtener codigo fuente
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Mostrar versiones
        run: |
          node --version
          npm --version
          java -version

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicacion Angular
        id: angular-build
        run: npm run build

      - name: Sincronizar Capacitor con Android
        id: capacitor-sync
        run: npx cap sync android

      - name: Dar permisos al Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK de Staging
        id: gradle-build
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Preparar APK de Staging
        id: prepare-apk
        run: |
          mkdir -p staging
          cp android/app/build/outputs/apk/debug/app-debug.apk staging/CasaMusicaCastillo-staging.apk
          test -f staging/CasaMusicaCastillo-staging.apk
          ls -lh staging/CasaMusicaCastillo-staging.apk

      - name: Publicar APK de Staging
        uses: actions/upload-artifact@v7
        with:
          name: casa-musica-castillo-staging-${{ github.run_number }}
          path: staging/CasaMusicaCastillo-staging.apk
          if-no-files-found: error
          retention-days: 14

      - name: Retroalimentación de entrega Staging
        if: always()
        env:
          SUMMARY_WORKFLOW: Release - Staging APK
          SUMMARY_CONTROLS: |
            Quality Gate del SHA|PASS|El job anterior exigió DEVOPS QUALITY GATE aprobado para este mismo commit.
            Angular build|${{ steps.angular-build.outcome == 'success' && 'PASS' || 'FAIL' }}|Compila la aplicación para entrega.
            Capacitor sync|${{ steps.capacitor-sync.outcome == 'success' && 'PASS' || 'FAIL' }}|Sincroniza assets/plugins.
            Gradle staging|${{ steps.gradle-build.outcome == 'success' && 'PASS' || 'FAIL' }}|Genera el APK; función BUILD/entrega.
            Verificación artifact|${{ steps.prepare-apk.outcome == 'success' && 'PASS' || 'FAIL' }}|Confirma nombre y existencia del archivo.
          SUMMARY_STATUS: ${{ (steps.angular-build.outcome == 'success' && steps.capacitor-sync.outcome == 'success' && steps.gradle-build.outcome == 'success' && steps.prepare-apk.outcome == 'success') && 'PASS' || 'FAIL' }}
          SUMMARY_DATA: Mismo SHA aprobado; APK Debug identificado como staging, sin secretos embebidos.
          SUMMARY_METRICS: Tamaño del APK visible en Preparar APK de Staging.
          SUMMARY_ARTIFACTS: casa-musica-castillo-staging-${{ github.run_number }}, retención 14 días.
        run: node scripts/write-workflow-summary.mjs
