<div class="cmc-input">
  <label class="cmc-input__label" [for]="inputId">
    {{ label() }}
    @if (required()) {
      <span class="cmc-input__required" aria-hidden="true">*</span>
    }
  </label>

  <div
    class="cmc-input__field"
    [class.cmc-input__field--filled]="isFilled()"
    [class.cmc-input__field--error]="hasError()"
    [class.cmc-input__field--disabled]="isDisabled()"
    [attr.data-feedback]="isDisabled() ? null : feedback()"
  >
    <input
      #control
      class="cmc-input__control"
      [id]="inputId"
      [attr.type]="type() === 'password' && revealed() ? 'text' : type()"
      [value]="value()"
      [placeholder]="placeholder()"
      [disabled]="isDisabled()"
      [required]="required()"
      [attr.autocomplete]="autocomplete()"
      [attr.inputmode]="inputMode()"
      [attr.aria-invalid]="hasError() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      (beforeinput)="onBeforeInput($event)"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />
    @if(type() === 'password') {
      <button type="button" class="cmc-input__visibility" [disabled]="isDisabled()" [attr.aria-controls]="inputId" [attr.aria-pressed]="revealed()" [attr.aria-label]="revealed() ? 'Ocultar contraseña' : 'Mostrar contraseña'" (pointerdown)="$event.preventDefault()" (click)="togglePassword(control)"><cmc-icon [name]="revealed() ? 'hidden' : 'eye'" /></button>
    }
  </div>

  @if (hasError()) {
    <p class="cmc-input__message cmc-input__message--error" [id]="errorId" role="alert">
      {{ error() }}
    </p>
  } @else if (hint()) {
    <p class="cmc-input__message" [id]="hintId">{{ hint() }}</p>
  }
</div>
