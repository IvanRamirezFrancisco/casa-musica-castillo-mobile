<dialog #dialog class="photo-viewer" [attr.aria-label]="'Fotografías de ' + title()" (close)="resetZoom()"
    (keydown.arrowleft)="onArrow($event, -1)" (keydown.arrowright)="onArrow($event, 1)">
    <div class="viewer-header">
      <h2>Fotografías del producto</h2>
      <button autofocus type="button" class="icon-action" aria-label="Cerrar visor" (click)="close()"><cmc-icon name="close"/></button>
    </div>
    @if(activePhoto(); as photo){
      <div #zoomArea class="viewer-image" tabindex="0" aria-label="Área desplazable de la fotografía">
        <div class="viewer-photo" [style.width.%]="zoom()*100" [style.height.%]="zoom()*100">
          <cmc-public-image [src]="photo" [alt]="title()"/>
        </div>
      </div>
      <div class="viewer-tools">
        @if(photos().length > 1){
          <button type="button" class="store-button" [disabled]="position() === 0" (click)="changeImage(-1)">Anterior</button>
          <button type="button" class="store-button" [disabled]="position() === photos().length - 1" (click)="changeImage(1)">Siguiente</button>
          <span role="status">{{position() + 1}} de {{photos().length}}</span>
        }
        <button type="button" class="icon-action" [disabled]="zoom()<=1" aria-label="Reducir zoom" (click)="changeZoom(-.5)"><cmc-icon name="remove"/></button>
        <button type="button" class="store-button" (click)="resetZoom()" aria-label="Restablecer zoom">{{zoom()*100}} %</button>
        <button type="button" class="icon-action" [disabled]="zoom()>=3" aria-label="Ampliar zoom" (click)="changeZoom(.5)"><cmc-icon name="add"/></button>
      </div>
    }
  </dialog>
