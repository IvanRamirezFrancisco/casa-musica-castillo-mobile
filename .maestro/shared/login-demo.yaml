- tapOn:
    id: "cmc-input-0"
- inputText: "qa@example.test"
- tapOn:
    id: "cmc-input-1"
- inputText: "demo-only"
- hideKeyboard
- tapOn: "Iniciar sesión"
- assertVisible: "Inicio"
